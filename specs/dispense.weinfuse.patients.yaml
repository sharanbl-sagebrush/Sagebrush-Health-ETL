# WeInfuse patient master - a dimension, not a transaction feed.
#
# The most PHI-dense of the WeInfuse sources: name, date of birth, email, three
# telephone numbers, postal address, emergency contact and three insurance
# member IDs. Direct identifiers are classified so they land encrypted; the
# WeInfuse UID and Patient Identifier stay in clear as join keys.
#
# The new reporting module cut this report almost in half - 48 columns to 23.
# Lost: Weinfuse UID, separate first and last name, Sex, Ethnicity, Race,
# Preferred Language, all insurance detail beyond a plan name, and both Group ID
# and Location ID.
#
# LOCATION ID IS THE LOSS THAT MATTERS. It is the site key the 340B verification
# plan relies on to attribute activity to a clinic, because shared wholesaler
# accounts cannot do it. The new report carries only a location *name*. The
# administered-drugs export still carries Location ID, so dispense attribution
# survives - but if this report is ever the only source of a patient's site,
# that link is now a name match rather than an identifier.
#
# Natural key: Patient Identifier is unique across all 1,918 rows, as is
# Weinfuse UID. Patient Identifier is used because the new module dropped the
# UID entirely.
#
# Two temporal shapes in one file, and they are not interchangeable: plain ISO
# dates for anything a human entered (date of birth, insurance effective date)
# and UTC timestamps for anything the system stamped (last updated, entered at).
# Declaring the wrong one quarantined all 1,918 rows on the first run of this
# spec - which is the intended behaviour, since a format that no longer matches
# must stop the load rather than be silently reinterpreted.

# ---- Source identity -------------------------------------------------------
# Everything above `variants:` describes the source as a whole. Each variant
# below describes one file shape the source can arrive in. Field meanings come
# from src/sbh_data_bank/registry/spec.py (SourceSpec).
#
# Stable identifier. Ledger tables and history are keyed on it; never renamed.
key: dispense.weinfuse.patients
# Display name for logs, reports and alerts.
name: WeInfuse - Patients
# Who produces the extract.
vendor: WeInfuse
# The delivery folder the file arrives under.
group: "2 Dispenses"
# What the finance team calls this source in the delivery catalogue.
catalog_names: ['Weinfuse - Patients']
# active: the source is expected to keep delivering, so silence raises an alert.
lifecycle: active
# Staleness threshold for freshness alerting, NOT a run schedule: alert when no
# new file has been seen for this many days. Files are uploaded every Sunday
# with ad hoc midweek re-uploads (CLAUDE.md, "How files arrive"); a midweek
# upload just resets the clock. Alerting is not built yet, so nothing reads
# this today. 7 is the generator default, not a measured delivery interval.
expected_cadence_days: 7

# Routing hint only: case-insensitive regexes tried against the filename. What
# a file IS is decided by the header fingerprint in the variant detectors
# below, so a renamed file still loads and a misnamed one does not load wrongly.
filename_patterns:
  - 'weinfuse.*patients'

# Natural key: the column that identifies one business row (a patient, since
# this is a dimension). Evidence: Patient Identifier was probed unique across
# all 1,918 rows (docs/data-findings.md, sections 10 and 13). Weinfuse UID is
# equally unique but the new module dropped it, so it cannot serve as the key
# across both variants. The probe itself is not in the repo.
natural_key: [patient_identifier]

# Drift policies: what happens when the vendor's column set changes.
#   on_new_column: warn      load anyway and record the extra column for review
#   on_missing_column: fail  stop; a declared column that vanished means the
#                            file is not what this spec says it is
on_new_column: warn
on_missing_column: fail

# ---- Variants --------------------------------------------------------------
# A variant is one shape this source's file can take. Detection is by header
# presence only: every `require_all` header must exist and no `require_none`
# header may. Exactly one variant must match or the load stops - zero matches
# is an unknown file, two is a spec bug (overlapping detectors) - and there is
# never a fallback default. Each variant carries its own `read` settings and
# column map, but all variants land on the same `target` names, so nothing
# downstream knows which shape wrote a row.
variants:
  # Variant 1: the new reporting module, 23 columns. Detected by `Patient ID`
  # (the new name for Patient Identifier) plus `Status` and `Substatus`, which
  # the legacy export does not carry.
  - name: reporting_module_2026
    description: >
      23-column workbook from the new reporting module.
      Substantially reduced; notably carries no Location ID.
    # Header-presence detector; see the note above `variants:`.
    detect:
      require_all: ['Patient ID', 'Status', 'Substatus']
    # No `read:` block: defaults apply (first sheet, header on row 0, utf-8-sig,
    # comma delimiter, trailing blank rows skipped, no totals footer).
    columns:
      # unnamed export artifact at this position, not data
      # Column fields, explained once; they mean the same in every spec:
      #   target        canonical column name the value lands under; stable
      #   sources       accepted vendor headers, tried in order, matched after
      #                 normalising case, punctuation and whitespace (no fuzzy match)
      #   type          text | integer | decimal | currency | date | boolean | ndc
      #                 currency is Decimal, never float, and reads "($40.00)" as -40
      #                 ndc normalises to 11 digits or quarantines when ambiguous
      #   required      the column must exist in the file AND every row must have a
      #                 value; a blank value quarantines that one row
      #   date_formats  explicit strptime formats tried in order; never inferred
      #   control_total summed per file and checked against the file's own totals
      #                 where it has them; only for additive amounts, never rates
      #   pii           none | join_key | quasi | direct | prohibited
      #                 direct is to land encrypted; prohibited is matched so drift
      #                 checks see it, then discarded before any value is written
      #   on_error      quarantine (default) | null | fail, per cell parse failure
      #   max_length    over-length text fails rather than truncates
      #   description   free text for the reader; the pipeline does not use it
      - target: group_name
        sources: ['Group', 'Group Name']
        type: text
      - target: location_name
        sources: ['Location', 'Location Name']
        type: text
      # System-stamped: a UTC timestamp ("2025-02-14 17:13:35 UTC"), so the formats
      # carry a time part. Contrast `date_of_birth` below, which is a plain date.
      # Declaring the wrong shape quarantined all 1,918 rows on the spec's first run
      # (docs/data-findings.md, section 11).
      # The new module carries no `Last Updated`; its `Created Date` is the
      # record creation date and binding it here made every known patient
      # look edited (layer walk). It lands under its own target below and
      # `last_updated` stays null for this variant.
      - target: last_updated
        sources: ['Last Updated']
        type: date
        date_formats: ['%Y-%m-%d %H:%M:%S UTC', '%Y-%m-%d %H:%M:%S']
      - target: vendor_created_date
        sources: ['Created Date']
        type: date
        date_formats: ['%Y-%m-%d %H:%M:%S UTC', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d']
      - target: patient_name
        sources: ['Patient Name']
        type: text
        pii: direct
      - target: patient_identifier
        sources: ['Patient ID', 'Patient Identifier']
        type: text
        required: true
        pii: join_key
      # Human-entered: a plain date, never a timestamp. See `last_updated`.
      - target: date_of_birth
        sources: ['DOB', 'Date of Birth']
        type: date
        date_formats: ['%Y-%m-%d', '%m/%d/%Y']
        pii: direct
      - target: status
        sources: ['Status']
        type: text
      - target: substatus
        sources: ['Substatus']
        type: text
      - target: mobile_phone
        sources: ['Mobile Phone']
        type: text
        pii: direct
      - target: home_phone
        sources: ['Home Phone']
        type: text
        pii: direct
      - target: email
        sources: ['Email']
        type: text
        pii: direct
      # Added by WeInfuse in the 2026-10 exports (seen first in the
      # 05012026-07312026 pull). Decided 2026-10-22, developer: load both.
      # Gender is a quasi-identifier; Notes is free text a clinician typed and
      # can hold anything, so it is classed direct.
      - target: gender
        sources: ['Gender']
        type: text
        pii: quasi
      - target: notes
        sources: ['Notes']
        type: text
        pii: direct
      - target: primary_insurance_plan
        sources: ['Primary Insurance Plan']
        type: text
      - target: secondary_insurance_plan
        sources: ['Secondary Insurance Plan']
        type: text
      - target: tertiary_insurance_plan
        sources: ['Tertiary Insurance Plan']
        type: text
      - target: address_line_1
        sources: ['Address Line 1']
        type: text
        pii: direct
      - target: address_line_2
        sources: ['Address Line 2']
        type: text
        pii: direct
      - target: city
        sources: ['City']
        type: text
        pii: quasi
      - target: state
        sources: ['State']
        type: text
        pii: quasi
      - target: zip_code
        sources: ['Zip Code']
        type: text
        pii: quasi
      - target: emergency_contact_name
        sources: ['Emergency Contact', 'Emergency Contact Name']
        type: text
        pii: direct
      - target: emergency_contact_phone
        sources: ['Emergency Contact Phone']
        type: text
        pii: direct
      - target: emergency_contact_relationship
        sources: ['Emergency Contact Relationship']
        type: text
  # Variant 2: the 48-column CSV from before the module change. Detected by
  # `Patient Identifier` and `Primary Insurance Member ID` (insurance detail
  # only the legacy export has) and by the ABSENCE of `Substatus`.
  - name: legacy_export
    description: >
      48-column CSV with full demographics and three
      tiers of insurance detail.
    # Header-presence detector; see the note above `variants:`.
    detect:
      require_all: ['Patient Identifier', 'Primary Insurance Member ID']
      require_none: ['Substatus']
    # No `read:` block: defaults apply (first sheet, header on row 0, utf-8-sig,
    # comma delimiter, trailing blank rows skipped, no totals footer).
    columns:
      - target: group_id
        sources: ['Group ID']
        type: text
      - target: group_name
        sources: ['Group Name', 'Group']
        type: text
      # The site key, present only in this legacy variant. The new module carries
      # only a location NAME (see the header note), so rows from the new module land
      # with location_id null.
      - target: location_id
        sources: ['Location ID']
        type: text
      - target: location_name
        sources: ['Location Name', 'Location']
        type: text
      - target: weinfuse_uid
        sources: ['Weinfuse UID', 'WeInfuse UID']
        type: text
        pii: join_key
      - target: patient_identifier
        sources: ['Patient Identifier', 'Patient ID']
        type: text
        required: true
        pii: join_key
      - target: first_name
        sources: ['First Name']
        type: text
        pii: direct
      - target: middle_initial
        sources: ['Middle Initial']
        type: text
        pii: direct
      - target: last_name
        sources: ['Last Name']
        type: text
        pii: direct
      # Human-entered: a plain date, never a timestamp. See `last_updated`.
      - target: date_of_birth
        sources: ['Date of Birth', 'DOB']
        type: date
        date_formats: ['%Y-%m-%d', '%m/%d/%Y']
        pii: direct
      - target: sex
        sources: ['Sex']
        type: text
        pii: quasi
      - target: ethnicity
        sources: ['Ethnicity']
        type: text
        pii: quasi
      - target: race
        sources: ['Race']
        type: text
        pii: quasi
      - target: preferred_language
        sources: ['Preferred Language']
        type: text
        pii: quasi
      - target: email
        sources: ['Email']
        type: text
        pii: direct
      - target: mobile_phone
        sources: ['Mobile Phone']
        type: text
        pii: direct
      - target: work_phone
        sources: ['Work Phone']
        type: text
        pii: direct
      - target: home_phone
        sources: ['Home Phone']
        type: text
        pii: direct
      - target: address_line_1
        sources: ['Address Line 1']
        type: text
        pii: direct
      - target: address_line_2
        sources: ['Address Line 2']
        type: text
        pii: direct
      - target: city
        sources: ['City']
        type: text
        pii: quasi
      - target: state
        sources: ['State']
        type: text
        pii: quasi
      - target: zip_code
        sources: ['Zip Code']
        type: text
        pii: quasi
      - target: emergency_contact_name
        sources: ['Emergency Contact Name', 'Emergency Contact']
        type: text
        pii: direct
      - target: emergency_contact_phone
        sources: ['Emergency Contact Phone']
        type: text
        pii: direct
      - target: emergency_contact_relationship
        sources: ['Emergency Contact Relationship']
        type: text
      # System-stamped: a UTC timestamp ("2025-02-14 17:13:35 UTC"), so the formats
      # carry a time part. Contrast `date_of_birth` below, which is a plain date.
      # Declaring the wrong shape quarantined all 1,918 rows on the spec's first run
      # (docs/data-findings.md, section 11).
      - target: last_updated
        sources: ['Last Updated']
        type: date
        date_formats: ['%Y-%m-%d %H:%M:%S UTC', '%Y-%m-%d %H:%M:%S']
      - target: primary_insurance_id
        sources: ['Primary Insurance ID']
        type: text
      - target: primary_insurance_name
        sources: ['Primary Insurance Name']
        type: text
      - target: primary_insurance_type
        sources: ['Primary Insurance Type']
        type: text
      - target: primary_insurance_member_id
        sources: ['Primary Insurance Member ID']
        type: text
        pii: direct
      - target: primary_insurance_group_id
        sources: ['Primary Insurance Group ID']
        type: text
      # The insurance block repeats the two temporal shapes: `*_entered_at` is a
      # system UTC timestamp, `*_effective_date` is a human-entered plain date.
      - target: primary_insurance_entered_at
        sources: ['Primary Insurance Entered At']
        type: date
        date_formats: ['%Y-%m-%d %H:%M:%S UTC', '%Y-%m-%d %H:%M:%S']
      - target: primary_insurance_effective_date
        sources: ['Primary Insurance Effective Date']
        type: date
        date_formats: ['%Y-%m-%d', '%m/%d/%Y']
      - target: secondary_insurance_id
        sources: ['Secondary Insurance ID']
        type: text
      - target: secondary_insurance_name
        sources: ['Secondary Insurance Name']
        type: text
      - target: secondary_insurance_type
        sources: ['Secondary Insurance Type']
        type: text
      - target: secondary_insurance_member_id
        sources: ['Secondary Insurance Member ID']
        type: text
        pii: direct
      - target: secondary_insurance_group_id
        sources: ['Secondary Insurance Group ID']
        type: text
      - target: secondary_insurance_entered_at
        sources: ['Secondary Insurance Entered At']
        type: date
        date_formats: ['%Y-%m-%d %H:%M:%S UTC', '%Y-%m-%d %H:%M:%S']
      - target: secondary_insurance_effective_date
        sources: ['Secondary Insurance Effective Date']
        type: date
        date_formats: ['%Y-%m-%d', '%m/%d/%Y']
      - target: tertiary_insurance_id
        sources: ['Tertiary Insurance ID']
        type: text
      - target: tertiary_insurance_name
        sources: ['Tertiary Insurance Name']
        type: text
      - target: tertiary_insurance_type
        sources: ['Tertiary Insurance Type']
        type: text
      - target: tertiary_insurance_member_id
        sources: ['Tertiary Insurance Member ID']
        type: text
        pii: direct
      - target: tertiary_insurance_group_id
        sources: ['Tertiary Insurance Group ID']
        type: text
      - target: tertiary_insurance_entered_at
        sources: ['Tertiary Insurance Entered At']
        type: date
        date_formats: ['%Y-%m-%d %H:%M:%S UTC', '%Y-%m-%d %H:%M:%S']
      - target: tertiary_insurance_effective_date
        sources: ['Tertiary Insurance Effective Date']
        type: date
        date_formats: ['%Y-%m-%d', '%m/%d/%Y']
