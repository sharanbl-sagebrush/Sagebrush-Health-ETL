# WeInfuse administered drugs - clinic administration events.
#
# Two variants, because WeInfuse moved to a new reporting module in the June
# 2026 drop. The export went from 33 CSV columns to 35 XLSX ones and renamed 14
# of them: Inner NDC to Inner NDC Code, Billing Code (HCPCS) to HCPCS, Date to
# Appointment Date, Unit Price to Price, and so on. Both variants land on one
# set of canonical names, so nothing downstream learns which module wrote a row.
#
# NATURAL KEY. (Order ID, Inventory Item ID) is unique across all 51,178 rows of
# the 2023-2026 extract. The earlier validation pack recorded this source as
# "candidate key unknown - best returned 25,738 duplicates out of 51,178"; it
# had been testing Weinfuse UID plus Appointment ID. Inventory Item ID is the
# discriminator, because one appointment administers several inventory items.
#
# The legacy Administered export and the BuyBill export are nearly identical -
# 33 columns each, differing only in Location/Type versus Location Name/Vendor.
# The detectors below use exactly those columns to keep them apart, since
# reading one as the other would mix medical-benefit administrations with
# buy-and-bill ones.

# ---- Source identity -------------------------------------------------------
# Everything above `variants:` describes the source as a whole. Each variant
# below describes one file shape the source can arrive in. Field meanings come
# from src/sbh_data_bank/registry/spec.py (SourceSpec).
#
# Stable identifier. Ledger tables and history are keyed on it; never renamed.
key: dispense.weinfuse.administered
# Display name for logs, reports and alerts.
name: WeInfuse - Administered Drugs
# Who produces the extract.
vendor: WeInfuse
# The delivery folder the file arrives under.
group: "2 Dispenses"
# What the finance team calls this source in the delivery catalogue.
catalog_names: ['Weinfuses - Administered Drug']
# active: the source is expected to keep delivering, so silence raises an alert.
lifecycle: active
# Staleness threshold for freshness alerting, NOT a run schedule: alert when no
# new file has been seen for this many days. Files are uploaded every Sunday
# with ad hoc midweek re-uploads (CLAUDE.md, "How files arrive"); a midweek
# upload just resets the clock. Alerting is not built yet, so nothing reads
# this today. 7 is the generator default, not a measured delivery interval.
expected_cadence_days: 7

# Routing hint only: case-insensitive regexes tried against the filename. What
# a file IS is decided by the header fingerprint in the variant detectors
# below, so a renamed file still loads and a misnamed one does not load wrongly.
# The first pattern refuses anything with "buybill" anywhere in the name:
# the BuyBill report is named "WeInfuse_BuyBill-AdministeredDrugsReport" and
# belongs to dispense.weinfuse.buybill. (Found by the backfill dry run,
# 2026-10-21: a lookahead placed after "administereddrugs" let them through.)
filename_patterns:
  - '^(?!.*buybill).*weinfuse.*administereddrugs'
  - '^(?!.*buybill).*weinfuse_administered'

# D14 (2026-10-21): the vendor's creation stamp is landed but left out of the
# row hash. It is text with no datetime type to normalise it, and the same
# instant arrives as `m/d/Y H:M` from one export path and `Y-m-d H:M:S` (with
# or without an offset) from another, so between the first two deliveries
# 19,643 of 19,644 "corrections" were the stamp's format and nothing else
# (layer walk). A row whose only change is this stamp is now `unchanged`.
row_hash_exclude: [vendor_created_at, vendor_created_date]

# Natural key: the target columns that identify one business row. Identity
# is this key plus an occurrence number; a newer delivery with a different
# hash is a correction that supersedes the earlier row (CLAUDE.md,
# "Duplicates").
# Evidence: (Order ID, Inventory Item ID) was probed unique across all 51,178
# rows of the 2023-2026 extract (docs/data-findings.md, sections 10 and 13).
# Why these two: one appointment administers several inventory items, so any
# key without Inventory Item ID collides by construction - the earlier
# validation pack's (Weinfuse UID, Appointment ID) gave 25,738 duplicates.
# The uniqueness probe itself is not in this repo; the claim rests on the
# findings doc and commit history and cannot yet be re-run on a new delivery.
natural_key: [order_id, inventory_item_id]

# Drift policies: what happens when the vendor's column set changes.
#   on_new_column: warn      load anyway and record the extra column for review
#   on_missing_column: fail  stop; a declared column that vanished means the
#                            file is not what this spec says it is
on_new_column: warn
on_missing_column: fail

# ---- Variants --------------------------------------------------------------
# A variant is one shape this source's file can take. Detection is by header
# presence only: every `require_all` header must exist and no `require_none`
# header may. Exactly one variant must match or the load stops - zero matches
# is an unknown file, two is a spec bug (overlapping detectors) - and there is
# never a fallback default. Each variant carries its own `read` settings and
# column map, but all variants land on the same `target` names, so nothing
# downstream knows which shape wrote a row.
variants:
  # Variant 1: the new reporting module (June 2026 drop onward). Detected by
  # `Inventory Type` (only the new module has it) plus `Inner NDC Code` (the
  # renamed form of `Inner NDC`). No `require_none` is needed because the
  # legacy variant below excludes `Inventory Type`.
  - name: reporting_module_2026
    description: >
      35-column workbook from the reporting module
      introduced in the June 2026 drop. Adds Inventory Type and Date of
      Birth Date; renames 14 columns.
    # Header-presence detector; see the note above `variants:`.
    detect:
      require_all: ['Inventory Type', 'Inner NDC Code', 'Billing Units']
    # No `read:` block: defaults apply (first sheet, header on row 0, utf-8-sig,
    # comma delimiter, trailing blank rows skipped, no totals footer).
    columns:
      # unnamed export artifact at this position, not data
      # Column fields, explained once; they mean the same in every spec:
      #   target        canonical column name the value lands under; stable
      #   sources       accepted vendor headers, tried in order, matched after
      #                 normalising case, punctuation and whitespace (no fuzzy match)
      #   type          text | integer | decimal | currency | date | boolean | ndc
      #                 currency is Decimal, never float, and reads "($40.00)" as -40
      #                 ndc normalises to 11 digits or quarantines when ambiguous
      #   required      the column must exist in the file AND every row must have a
      #                 value; a blank value quarantines that one row
      #   date_formats  explicit strptime formats tried in order; never inferred
      #   control_total summed per file and checked against the file's own totals
      #                 where it has them; only for additive amounts, never rates
      #   pii           none | join_key | quasi | direct | prohibited
      #                 direct is to land encrypted; prohibited is matched so drift
      #                 checks see it, then discarded before any value is written
      #   on_error      quarantine (default) | null | fail, per cell parse failure
      #   max_length    over-length text fails rather than truncates
      #   description   free text for the reader; the pipeline does not use it
      - target: group_id
        sources: ['Group ID']
        type: text
      - target: group_name
        sources: ['Group Name']
        type: text
      - target: location_id
        sources: ['Location ID']
        type: text
        description: >
          The site key. The 340B verification plan requires this to
          attribute a dispense to a clinic, because ABC account 0100583154 is
          shared across all three clinics and Cardinal 2057234776 across two -
          account number alone cannot separate them.
      - target: location
        sources: ['Location Name', 'Location']
        type: text
      - target: order_series_id
        sources: ['Order Series ID']
        type: text
      # First half of the natural key.
      - target: order_id
        sources: ['Order ID']
        type: text
        required: true
      - target: inventory_type
        sources: ['Inventory Type']
        type: text
        description: >
          Called Type in the legacy export and Inventory Type in the new
          module, and it carried the vendor name (Henry Schein, Curascript) in the
          legacy form. Worth checking before it is used as a channel signal.
      - target: appointment_id
        sources: ['Appointment ID']
        type: text
      - target: appointment_status
        sources: ['Appointment Status']
        type: text
      - target: patient_identifier
        sources: ['Patient Identifier']
        type: text
        pii: join_key
      - target: weinfuse_uid
        sources: ['WeInfuse UID', 'Weinfuse UID']
        type: text
        pii: join_key
      - target: patient_first_name
        sources: ['Patient First Name']
        type: text
        pii: direct
      - target: patient_last_name
        sources: ['Patient Last Name']
        type: text
        pii: direct
      - target: provider_first_name
        sources: ['Provider First Name']
        type: text
      - target: provider_last_name
        sources: ['Provider Last Name']
        type: text
      - target: provider_npi
        sources: ['Provider NPI']
        type: text
      - target: inventory_item_id
        sources: ['Inventory Item ID']
        type: text
        required: true
        description: >
          The discriminator that makes a row unique. One appointment
          administers several inventory items, which is why keys built on
          appointment alone showed 25,738 duplicates in 51,178 rows.
      # type ndc: normalised to the 11-digit form; see transforms/ndc.py.
      - target: inner_ndc
        sources: ['Inner NDC Code', 'Inner NDC']
        type: ndc
      - target: outer_ndc
        sources: ['Outer NDC Code', 'Outer NDC']
        type: ndc
        description: >
          The package NDC, where inner_ndc is the unit. Both captured; the
          pair is an input to package-to-billing-unit conversion.
      - target: label_name
        sources: ['Label Name']
        type: text
      - target: strength
        sources: ['Strength']
        type: decimal
      - target: uom
        sources: ['UOM']
        type: text
      - target: lot
        sources: ['Lot']
        type: text
      - target: expiration
        sources: ['Expiration Date', 'Expiration']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: primary_insurance_plan
        sources: ['Primary Insurance', 'Primary Insurance Plan']
        type: text
      - target: secondary_insurance_plan
        sources: ['Secondary Insurance', 'Secondary Insurance Plan']
        type: text
      - target: tertiary_insurance_plan
        sources: ['Tertiary Insurance', 'Tertiary Insurance Plan']
        type: text
      - target: billing_code_hcpcs
        sources: ['HCPCS', 'Billing Code (HCPCS)']
        type: text
      - target: billing_units
        sources: ['Billing Units']
        type: decimal
        control_total: true
        description: >
          HCPCS billing units, NOT packages. Wholesalers ship packages, so
          no comparison between the two is valid without multiplying purchases by
          BILLUNITSPKG from the ASP crosswalk. That conversion is reconciliation
          work; this is the figure it starts from.
      # The event date. `required` here means a row with no date quarantines, which
      # is intended: an administration without a date cannot be placed in a period.
      # Both formats are declared because the two modules write dates differently.
      - target: administration_date
        sources: ['Appointment Date', 'Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        required: true
      - target: administration_time
        sources: ['Appointment Time', 'Time']
        type: text
      # Order creation stamp of the new module, landed as text; a different
      # timestamp from the legacy `Created At`, so its own target.
      - target: vendor_created_date
        sources: ['Created Date']
        type: text
      - target: date_of_birth
        sources: ['Date of Birth Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        pii: direct
      - target: unit_price
        sources: ['Price', 'Unit Price']
        type: currency
        description: >
          A rate - deliberately not a control total.
  # Variant 2: the 33-column CSV export used through the March 2026 drop.
  # Detected by `Type` and `Inner NDC` (legacy names) and by the ABSENCE of
  # `Inventory Type` (not the new module) and `Vendor` (not the BuyBill export,
  # which is otherwise the same 33 columns).
  - name: legacy_export
    description: >
      33-column CSV export used through the March 2026
      drop. Distinguished from BuyBill by carrying Type and Location
      where BuyBill carries Vendor and Location Name.
    # Header-presence detector; see the note above `variants:`.
    detect:
      require_all: ['Type', 'Inner NDC', 'Billing Units']
      require_none: ['Inventory Type', 'Vendor']
    # No `read:` block: defaults apply (first sheet, header on row 0, utf-8-sig,
    # comma delimiter, trailing blank rows skipped, no totals footer).
    columns:
      - target: group_id
        sources: ['Group ID']
        type: text
      - target: group_name
        sources: ['Group Name']
        type: text
      - target: location_id
        sources: ['Location ID']
        type: text
        description: >
          The site key. The 340B verification plan requires this to
          attribute a dispense to a clinic, because ABC account 0100583154 is
          shared across all three clinics and Cardinal 2057234776 across two -
          account number alone cannot separate them.
      - target: location
        sources: ['Location', 'Location Name']
        type: text
      - target: order_series_id
        sources: ['Order Series ID']
        type: text
      # First half of the natural key.
      - target: order_id
        sources: ['Order ID']
        type: text
        required: true
      - target: inventory_type
        sources: ['Type']
        type: text
        description: >
          Called Type in the legacy export and Inventory Type in the new
          module, and it carried the vendor name (Henry Schein, Curascript) in the
          legacy form. Worth checking before it is used as a channel signal.
      - target: appointment_id
        sources: ['Appointment ID']
        type: text
      - target: appointment_status
        sources: ['Appointment Status']
        type: text
      - target: weinfuse_uid
        sources: ['Weinfuse UID', 'WeInfuse UID']
        type: text
        pii: join_key
      - target: patient_identifier
        sources: ['Patient Identifier']
        type: text
        pii: join_key
      - target: patient_first_name
        sources: ['Patient First Name']
        type: text
        pii: direct
      - target: patient_last_name
        sources: ['Patient Last Name']
        type: text
        pii: direct
      - target: provider_first_name
        sources: ['Provider First Name']
        type: text
      - target: provider_last_name
        sources: ['Provider Last Name']
        type: text
      - target: provider_npi
        sources: ['Provider NPI']
        type: text
      - target: inventory_item_id
        sources: ['Inventory Item ID']
        type: text
        required: true
        description: >
          The discriminator that makes a row unique. One appointment
          administers several inventory items, which is why keys built on
          appointment alone showed 25,738 duplicates in 51,178 rows.
      # type ndc: normalised to the 11-digit form; see transforms/ndc.py.
      - target: inner_ndc
        sources: ['Inner NDC', 'Inner NDC Code']
        type: ndc
      - target: outer_ndc
        sources: ['Outer NDC', 'Outer NDC Code']
        type: ndc
        description: >
          The package NDC, where inner_ndc is the unit. Both captured; the
          pair is an input to package-to-billing-unit conversion.
      - target: label_name
        sources: ['Label Name']
        type: text
      - target: strength
        sources: ['Strength']
        type: decimal
      - target: uom
        sources: ['UOM']
        type: text
      - target: lot
        sources: ['Lot']
        type: text
      - target: expiration
        sources: ['Expiration', 'Expiration Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: primary_insurance_plan
        sources: ['Primary Insurance Plan', 'Primary Insurance']
        type: text
      - target: secondary_insurance_plan
        sources: ['Secondary Insurance Plan', 'Secondary Insurance']
        type: text
      - target: tertiary_insurance_plan
        sources: ['Tertiary Insurance Plan', 'Tertiary Insurance']
        type: text
      - target: unit_price
        sources: ['Unit Price', 'Price']
        type: currency
        description: >
          A rate - deliberately not a control total.
      - target: billing_code_hcpcs
        sources: ['Billing Code (HCPCS)', 'HCPCS']
        type: text
      - target: billing_units
        sources: ['Billing Units']
        type: decimal
        control_total: true
        description: >
          HCPCS billing units, NOT packages. Wholesalers ship packages, so
          no comparison between the two is valid without multiplying purchases by
          BILLUNITSPKG from the ASP crosswalk. That conversion is reconciliation
          work; this is the figure it starts from.
      # The event date. `required` here means a row with no date quarantines, which
      # is intended: an administration without a date cannot be placed in a period.
      # Both formats are declared because the two modules write dates differently.
      - target: administration_date
        sources: ['Date', 'Appointment Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        required: true
      - target: administration_time
        sources: ['Time', 'Appointment Time']
        type: text
      # Record creation stamp of the legacy export, landed as text rather
      # than parsed; not used for period logic.
      - target: vendor_created_at
        sources: ['Created At']
        type: text

  # Variant 3: the BuyBill export arriving under this report's name. The
  # Jan-Apr 2026 drop's `WeInfuse_AdministeredDrugsReport ...csv` is byte
  # for byte the BuyBill export delivered beside it (established 2026-09-04;
  # no administered data exists for that window). This spec's filename hint
  # claims the misnamed copy, so it is recognised for what it is and handed
  # to the BuyBill source, which loads the correctly named copy and records
  # this one as the same bytes. Detector copied from the BuyBill spec.
  - name: buybill_export
    action: recognise_only
    loaded_by: dispense.weinfuse.buybill
    description: >
      The 33-column BuyBill export (Vendor and Location Name where this
      report carries Type and Location), misfiled under the administered
      report's name. `dispense.weinfuse.buybill` loads it.
    detect:
      require_all: ['Vendor', 'Inner NDC', 'Billing Units']
      require_none: ['Inventory Type', 'Type']
    # columns: the natural-key columns only, because the model requires
    # every variant to carry the key; nothing from this variant lands.
    columns:
      - target: order_id
        sources: ['Order ID']
        type: text
        required: true
      - target: inventory_item_id
        sources: ['Inventory Item ID']
        type: text
        required: true
