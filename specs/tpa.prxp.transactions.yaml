# PRXP rx transaction details.
#
# Natural key: Rx Transaction ID, unique across all 5,133 rows - the one source
# the earlier validation pack already had right.
#
# 90 columns in the 2023-2026 extract and 94 in the later drops. The extra four
# have not been reconciled against a spec yet, so on_new_column is set to warn
# rather than fail: a newer delivery loads and the additions are reported, rather
# than the whole file being refused. Tighten this to fail once the added columns
# are known and mapped.

key: tpa.prxp.transactions
name: PRXP - Rx Transaction Details
vendor: PRXP
group: "4 TPA"
catalog_names: ['Prxp']
lifecycle: active
expected_cadence_days: 7

filename_patterns:
  - 'prxp.*transaction'

natural_key: [rx_transaction_id]

on_new_column: warn
on_missing_column: fail

variants:
  - name: transactions_90
    description: >
      90 columns, the 2023-2026 shape.
    detect:
      require_all: ['Rx Transaction ID']
    columns:
      - target: rx_transaction_id
        sources: ['Rx Transaction ID']
        type: text
        required: true
      - target: rx_number
        sources: ['Rx Number']
        type: text
      - target: date_written
        sources: ['Date Written']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: rx_fill_date
        sources: ['Rx Fill Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: patient_last_name
        sources: ['Patient Last Name']
        type: text
        pii: direct
      - target: patient_first_name
        sources: ['Patient First Name']
        type: text
        pii: direct
      - target: patient_date_of_birth
        sources: ['Patient Date Of Birth']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: ndc
        sources: ['NDC']
        type: ndc
      - target: days_supply
