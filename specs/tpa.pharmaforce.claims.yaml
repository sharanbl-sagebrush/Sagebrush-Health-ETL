# Pharmaforce 340B claims.
#
# ONE spec for both delivery files. Fire Mesa and Southington arrive as separate
# extracts with the same 65 columns, and Claim ID is unique across both - 196,187
# rows, 196,187 distinct ids, zero collisions - so they are one source, not two.
#
# The previous implementation ran one parser class twice with a location string
# injected from configuration. That is unnecessary: every row already carries
# OPAID and Covered Entity, so the entity comes from the data rather than from a
# setting that can drift out of step with the file it describes.
#
# Two covered entities exist in this data: STD891281 (Fire Mesa, Nevada) and
# STD06489 (Southington, Connecticut). Southington contributes 1,280 rows to Fire
# Mesa's 194,907, consistent with its 340B participation ending on 2025-07-17.
#
# Qty Dispensed is negative on about 8.7% of rows. Those are reversals, written
# as negative quantities on the same claim shape rather than as separate reversal
# claims - see the column note.

# ---- Source identity -------------------------------------------------------
# Everything above `variants:` describes the source as a whole. Each variant
# below describes one file shape the source can arrive in. Field meanings come
# from src/sbh_data_bank/registry/spec.py (SourceSpec).
#
# Stable identifier. Ledger tables and history are keyed on it; never renamed.
key: tpa.pharmaforce.claims
# Display name for logs, reports and alerts.
name: Pharmaforce - 340B Claims
# Who produces the extract.
vendor: Pharmaforce
# The delivery folder the file arrives under.
group: "4 TPA"
# What the finance team calls this source in the delivery catalogue.
catalog_names: ['Pharmaforce - Firemesa', 'Pharmaforce - Southington']
# active: the source is expected to keep delivering, so silence raises an alert.
lifecycle: active
# Staleness threshold for freshness alerting, NOT a run schedule: alert when no
# new file has been seen for this many days. Files are uploaded every Sunday
# with ad hoc midweek re-uploads (CLAUDE.md, "How files arrive"); a midweek
# upload just resets the clock. Alerting is not built yet, so nothing reads
# this today. 7 is the generator default, not a measured delivery interval.
expected_cadence_days: 7

# Routing hint only: case-insensitive regexes tried against the filename. What
# a file IS is decided by the header fingerprint in the variant detectors
# below, so a renamed file still loads and a misnamed one does not load wrongly.
filename_patterns:
  - 'pharmaforce.*claim'

# Natural key: the column that identifies one business row. Evidence: Claim ID
# was probed unique across BOTH site files together - 196,187 rows, 196,187
# distinct ids (docs/data-findings.md, section 13) - which is what justifies
# one spec for two deliveries. The probe itself is not in the repo.
#
# No `constants:` block, although CLAUDE.md and docs/file-audit.md describe
# this spec as serving two sites "via constants". The spec model supports
# constants (values injected into every row), but this spec does not need
# them: every row already carries OPAID and Covered Entity, so the entity is
# read from the data instead of from a per-file setting that could drift.
natural_key: [claim_id]

# Drift policies: what happens when the vendor's column set changes.
#   on_new_column: warn      load anyway and record the extra column for review
#   on_missing_column: fail  stop; a declared column that vanished means the
#                            file is not what this spec says it is
on_new_column: warn
on_missing_column: fail

# ---- Variants --------------------------------------------------------------
# A variant is one shape this source's file can take. Detection is by header
# presence only: every `require_all` header must exist and no `require_none`
# header may. Exactly one variant must match or the load stops - zero matches
# is an unknown file, two is a spec bug (overlapping detectors) - and there is
# never a fallback default. Each variant carries its own `read` settings and
# column map, but all variants land on the same `target` names, so nothing
# downstream knows which shape wrote a row.
variants:
  # Single variant: both site files share the same 65 columns. Detected by
  # `Claim ID` plus the two entity columns, so a file that lacks the entity
  # information would be refused rather than loaded unattributed.
  - name: claims_65
    description: >
      65 columns, identical for both site deliveries.
    # Header-presence detector; see the note above `variants:`.
    detect:
      require_all: ['Claim ID', 'OPAID', 'Covered Entity']
    # No `read:` block: defaults apply (first sheet, header on row 0, utf-8-sig,
    # comma delimiter, trailing blank rows skipped, no totals footer).
    columns:
      # Column fields, explained once; they mean the same in every spec:
      #   target        canonical column name the value lands under; stable
      #   sources       accepted vendor headers, tried in order, matched after
      #                 normalising case, punctuation and whitespace (no fuzzy match)
      #   type          text | integer | decimal | currency | date | boolean | ndc
      #                 currency is Decimal, never float, and reads "($40.00)" as -40
      #                 ndc normalises to 11 digits or quarantines when ambiguous
      #   required      the column must exist in the file AND every row must have a
      #                 value; a blank value quarantines that one row
      #   date_formats  explicit strptime formats tried in order; never inferred
      #   control_total summed per file and checked against the file's own totals
      #                 where it has them; only for additive amounts, never rates
      #   pii           none | join_key | quasi | direct | prohibited
      #                 direct is to land encrypted; prohibited is matched so drift
      #                 checks see it, then discarded before any value is written
      #   on_error      quarantine (default) | null | fail, per cell parse failure
      #   max_length    over-length text fails rather than truncates
      #   description   free text for the reader; the pipeline does not use it
      - target: covered_entity
        sources: ['Covered Entity']
        type: text
        required: true
      - target: opaid
        sources: ['OPAID']
        type: text
        required: true
        description: >
          The covered-entity key. Two exist in this data: STD891281 (Fire
          Mesa, Nevada) and STD06489 (Southington, Connecticut). The same identifier
          appears as OPAID here, as 340B ID in Wellpartner Claims, embedded in Entity Name
          in Wellpartner Invoices, and as Associated 340B ID in the McKesson Custom
          report - which makes it the one key that ties every feed to a covered entity.
      - target: chain_pharmacy
        sources: ['Chain Pharmacy']
        type: text
      - target: pharmacy
        sources: ['Pharmacy']
        type: text
      - target: pharmacy_nabp_or_npi
        sources: ['Pharmacy NABP or NPI']
        type: text
      - target: transaction_code
        sources: ['Transaction Code']
        type: text
      - target: prescription
        sources: ['Prescription #']
        type: text
      - target: date_rx_written
        sources: ['Date Rx Written']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: bin
        sources: ['BIN']
        type: text
      - target: pcn
        sources: ['PCN']
        type: text
      - target: group
        sources: ['Group']
        type: text
      - target: secondary_bin
        sources: ['Secondary BIN']
        type: text
      - target: secondary_pcn
        sources: ['Secondary PCN']
        type: text
      - target: secondary_group
        sources: ['Secondary Group']
        type: text
      - target: other_coverage_code
        sources: ['Other Coverage Code']
        type: text
      - target: submission_clarification_code
        sources: ['Submission Clarification Code']
        type: text
      - target: refill
        sources: ['Refill #']
        type: text
      # The dispense date; required so every claim can be placed in a period.
      - target: fill_date
        sources: ['Fill Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        required: true
      - target: claim_date
        sources: ['Claim Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      # The natural key.
      - target: claim_id
        sources: ['Claim ID']
        type: text
        required: true
      - target: patient_id
        sources: ['Patient ID']
        type: text
        pii: join_key
      - target: gender
        sources: ['Gender']
        type: text
        pii: quasi
      - target: first_name
        sources: ['First Name']
        type: text
        pii: direct
      - target: last_name
        sources: ['Last Name']
        type: text
        pii: direct
      - target: dob
        sources: ['DOB']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        pii: direct
      - target: prescriber_name
        sources: ['Prescriber Name']
        type: text
      - target: prescriber_npi_dea
        sources: ['Prescriber NPI/DEA']
        type: text
      # type ndc: normalised to the 11-digit form; see transforms/ndc.py.
      - target: ndc
        sources: ['NDC']
        type: ndc
      - target: drug_name
        sources: ['Drug Name']
        type: text
      - target: package_size
        sources: ['Package Size']
        type: decimal
      - target: mfg_name
        sources: ['Mfg. Name']
        type: text
      - target: drug_indicator
        sources: ['Drug Indicator']
        type: text
      - target: qty_dispensed
        sources: ['Qty Dispensed']
        type: decimal
        control_total: true
        description: >
          Negative on roughly 8.7% of rows - 17,052 of 194,907 in the
          2023-2026 extract. The earlier validation pack flagged this as a possible
          integrity problem because it assumed reversals arrive as separate claims.
          They do not: Pharmaforce writes a reversal as a negative quantity on the
          same claim shape, so the negatives are the reversal mechanism and must be
          summed, not filtered. Confirm with the Pharmaforce account team before
          any roll-up relies on it.
      - target: days_supply
        sources: ['Days supply']
        type: decimal
      - target: claim_type
        sources: ['Claim Type']
        type: text
      - target: claim_sub_type
        sources: ['Claim Sub Type']
        type: text
      - target: reason
        sources: ['Reason']
        type: text
      - target: sub_reason
        sources: ['Sub Reason']
        type: text
      # The money block: every extended amount is a control_total, summed per file.
      # Pharmaforce ships no totals footer, so these are our own file sums, kept
      # for the batch record and for reconciling one delivery against the next.
      - target: patient_pay
        sources: ['Patient Pay']
        type: currency
        control_total: true
      - target: third_party_payment
        sources: ['Third Party Payment']
        type: currency
        control_total: true
      - target: total_payment
        sources: ['Total Payment']
        type: currency
        control_total: true
      - target: disp_fee
        sources: ['Disp. Fee']
        type: currency
        control_total: true
      - target: ce_receivable
        sources: ['CE Receivable']
        type: currency
        control_total: true
        description: >
          What the covered entity is owed. Distinct from Profit OR Loss -
          the previous financial view used one Wellpartner field for both
          receivable and profit, which is a defect this separation avoids.
      - target: n340b_drug_cost
        sources: ['340B Drug Cost']
        type: currency
        control_total: true
      - target: total_claim_cost
        sources: ['Total Claim Cost']
        type: currency
        control_total: true
      - target: profit_or_loss
        sources: ['Profit OR Loss']
        type: currency
        control_total: true
      - target: retail_drug_cost
        sources: ['Retail Drug Cost']
        type: currency
        control_total: true
      - target: comments
        sources: ['Comments']
        type: text
      - target: medical_record
        sources: ['Medical Record #']
        type: text
        pii: join_key
      - target: encounter_visit_id
        sources: ['Encounter Visit ID']
        type: text
      - target: encounter_visit_date
        sources: ['Encounter Visit Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: encounter_discharge_date
        sources: ['Encounter Discharge Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: encounter_service_location
        sources: ['Encounter Service Location']
        type: text
      - target: encounter_service_location_code
        sources: ['Encounter Service Location Code']
        type: text
      - target: e_prescribe_mrn
        sources: ['E-Prescribe MRN']
        type: text
      - target: e_prescribe_visit_number
        sources: ['E-Prescribe  Visit Number']
        type: text
      - target: e_prescribe_order_date
        sources: ['E-Prescribe  Order Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: e_prescribe_service_location
        sources: ['E-Prescribe Service Location']
        type: text
      - target: e_prescribe_service_location_code
        sources: ['E-Prescribe Service Location Code']
        type: text
      - target: replenishment_status
        sources: ['Replenishment Status']
        type: text
      - target: billing_model
        sources: ['Billing Model']
        type: text
      - target: claim_captured_date
        sources: ['Claim Captured Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: trued_up_units
        sources: ['Trued Up Units']
        type: decimal
        control_total: true
      - target: trued_up_cost
        sources: ['Trued Up Cost']
        type: currency
        control_total: true
      - target: trued_up_date
        sources: ['Trued Up Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
