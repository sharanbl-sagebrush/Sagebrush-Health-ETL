        type: text
      - target: datetime_scheduled
        sources: ['DateTime_Scheduled']
        type: date
        date_formats: ['%m/%d/%Y %H:%M', '%m/%d/%Y %H:%M:%S', '%m/%d/%Y']
      - target: scheduled_by
