# Curve appointment details.
#
# 101 columns, 199,591 rows, 143 MB. Never loaded by the previous pipeline.
#
# NO NATURAL KEY - the export carries no appointment identifier. See notes.
#
# Heavily identifying: patient and guarantor names, addresses, dates of birth,
# telephone numbers and email. Classified so they land encrypted.

# ---- Identity and routing -------------------------------------------------
# key: stable identifier for this source. Ledger history is keyed on it, so
# it never changes. name and vendor are for display only.
key: ehr.curve.appointments
name: Curve - Appointment Details by Date
vendor: Curve / Allscripts
# group: the delivery folder the finance team drops this file into.
group: "3 AllscriptsCurve"
# catalog_names: what the finance team calls this report in their source
# catalogue, so the two can be matched up.
catalog_names: ['Encounter']
# lifecycle: active means silence from this source raises a freshness
# alert. discontinued, no_access and planned sources are never alerted on.
lifecycle: active
# expected_cadence_days: a staleness threshold for alerting ("alert if no
# new file in N days"), not a schedule. Files are uploaded every Sunday with
# ad hoc midweek re-uploads; see CLAUDE.md "How files arrive". null means
# irregular.
expected_cadence_days: 7

# filename_patterns: case-insensitive regexes, a routing hint only. What a
# file actually is gets decided by the variant detector below from its header
# row, so a renamed file still loads and a misnamed one does not load wrongly.
# Not anchored on extension: the same source can arrive as CSV or XLSX.
filename_patterns:
  - 'curve.*appointment'

# natural_key: EMPTY. The export carries no appointment identifier. Best
# candidate tested was (Patient_Number, Appointment_DateTime), still leaving
# 11,385 duplicates across 199,591 rows. Figures from docs/data-findings.md
# section 13; the probe itself is not in this repo.
#
# Dedup (CLAUDE.md, "Duplicates"): no key, so identity is every landed column
# plus an occurrence number in file order. The ten exact-duplicate rows
# in the notes become occurrence 2 of their identity and survive; they are
# also reported as duplicate findings (stg.duplicate_finding).
natural_key: []

# on_new_column / on_missing_column: drift policy when the vendor changes the
# column set. An unexpected new column warns and the load continues; a missing
# column fails the file. Nothing is ever silently dropped, which is what the
# previous pipeline did.
on_new_column: warn
on_missing_column: fail
# notes: free text. Mandatory when natural_key is empty - the spec model
# rejects a keyless spec that does not record what was tested and why.
notes: >
  Three temporal shapes, none interchangeable: plain dates
  (Patient_DOB, Date_Of_Account) as MM/DD/YYYY, timestamps (Appointment_DateTime,
  DateTime_Scheduled) as MM/DD/YYYY H:MM with a non-padded hour, and
  Check_In_Time / Check_Out_Time as bare HHMM integers - 1454 for 14:54 - with no
  date part at all. The last of those are kept as text, because resolving them to
  a timestamp means assuming which day they belong to.
  
  No natural key. The export carries no appointment identifier at
  all; (Patient_Number, Appointment_DateTime) leaves 11,385 duplicate rows across
  199,591. Ten rows are exact duplicates across all 101 columns.
  
  Curve holds an appointment id internally - Monthly Services and Monthly Payments
  both reference vouchers and services by id - so this is a reporting omission
  rather than a modelling one, and worth requesting.

# variants: the shapes this source's file can take. A variant is one shape,
# detected from the header row alone - require_all lists columns that must be
# present, require_none columns that must be absent. Exactly one variant must
# match a file or the load stops; zero and two are both errors, never resolved
# by guessing. Each variant has its own read settings and column map, but all
# land on the same target names, so nothing downstream knows which shape wrote
# a row.
variants:
  # One shape so far: 101 columns. The detector pairs the patient number with
  # the scheduling-resource columns that only this Curve report carries.
  - name: appointments_101
    detect:
      require_all: ['Patient_Number', 'ResDesc', 'Resource_Abbr']
    # No read block: header on row 0, no footer, default encoding. At 143 MB
    # the file is read by the streaming reader rather than loaded whole.
    columns:
      # Column fields, explained once:
      #   target        canonical column name in the warehouse. Stable; vendors
      #                 rename, we do not.
      #   sources       accepted vendor headers, matched after normalising case,
      #                 punctuation and whitespace. List several when a vendor
      #                 has renamed a column.
      #   type          text | integer | decimal | currency | date | boolean | ndc
      #   required      the column must exist in the file AND every row must
      #                 have a value. Column absent is drift (see policy above);
      #                 value absent quarantines that one row.
      #   date_formats  strptime formats tried in order. Mandatory for dates and
      #                 never inferred: 01/02/2025 is ambiguous without one.
      #   pii           none | join_key | quasi | direct | prohibited. direct lands
      #                 encrypted; join_key stays in clear because reconciliation
      #                 joins on it; prohibited is matched for drift checks and
      #                 then discarded before any value is written anywhere.
      #   on_error      quarantine (default) | null | fail, per cell parse failure.
      #   control_total the column is additive and summed as a load control figure.
      #   max_length    over-length text fails rather than truncates.
      #   description   free text for the reader.
      #
      # 101 columns follow. Most are self-explanatory and carry only a pii
      # class; comments below mark the ones with something to know.
      - target: resdesc
        sources: ['ResDesc']
        type: text
      - target: resource_abbr
        sources: ['Resource_Abbr']
        type: text
      - target: resource_group
        sources: ['Resource_Group']
        type: text
      - target: resource_specialty
        sources: ['Resource_Specialty']
        type: text
      - target: patient_last_name
        sources: ['Patient_Last_Name']
        type: text
        pii: direct
      - target: patient_first_name
        sources: ['Patient_First_Name']
        type: text
        pii: direct
      # Candidate-key column, with appointment_datetime further down.
      - target: patient_number
        sources: ['Patient_Number']
        type: text
        pii: join_key
      - target: street1
        sources: ['Street1']
        type: text
        pii: direct
      - target: street2
        sources: ['Street2']
        type: text
        pii: direct
      - target: city
        sources: ['City']
        type: text
        pii: quasi
      - target: state
        sources: ['State']
        type: text
        pii: quasi
      - target: zip_code
        sources: ['ZIP_Code']
        type: text
        pii: quasi
      - target: patient_dob
        sources: ['Patient_DOB']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        pii: direct
      - target: patient_age
        sources: ['Patient_Age']
        type: text
        pii: quasi
      - target: patient_gender
        sources: ['Patient_Gender']
        type: text
        pii: quasi
      - target: patient_primary_phone
        sources: ['Patient_Primary_Phone']
        type: text
        pii: direct
      - target: patient_cell_phone
        sources: ['Patient_Cell_Phone']
        type: text
        pii: direct
      - target: patient_work_phone
        sources: ['Patient_Work_Phone']
        type: text
        pii: direct
      - target: patient_pcp
        sources: ['Patient_PCP']
        type: text
      - target: patient_usual_provider
        sources: ['Patient_Usual_Provider']
        type: text
      - target: patient_ref_provider
        sources: ['Patient_Ref_Provider']
        type: text
      - target: patient_email
        sources: ['Patient_Email']
        type: text
        pii: direct
      # guar_* columns are the guarantor (the person financially responsible),
      # a second identified individual on every row. Classified direct.
      - target: guar_last_name
        sources: ['Guar_Last_Name']
        type: text
        pii: direct
      - target: guar_first_name
        sources: ['Guar_First_Name']
        type: text
        pii: direct
      - target: guar_account_number
        sources: ['Guar_Account_Number']
        type: text
        pii: direct
      - target: guar_street1
        sources: ['Guar_Street1']
        type: text
        pii: direct
      - target: guar_street2
        sources: ['Guar_Street2']
        type: text
        pii: direct
      - target: guar_city
        sources: ['Guar_City']
        type: text
        pii: direct
      - target: guar_state
        sources: ['Guar_State']
        type: text
        pii: direct
      - target: guar_zip_code
        sources: ['Guar_Zip_Code']
        type: text
        pii: direct
      - target: guar_dob
        sources: ['Guar_DOB']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        pii: direct
      - target: guar_gender
        sources: ['Guar_Gender']
        type: text
        pii: direct
      - target: guar_home_phone
        sources: ['Guar_Home_Phone']
        type: text
        pii: direct
      - target: guar_cell_phone
        sources: ['Guar_Cell_Phone']
        type: text
        pii: direct
      - target: guar_email
        sources: ['Guar_Email']
        type: text
        pii: direct
      - target: prim_policy_carrier_name
        sources: ['Prim_Policy_Carrier_Name']
        type: text
      - target: prim_policy_carrier_category_descr
        sources: ['Prim_Policy_Carrier_Category_Descr']
        type: text
      - target: certificate_number
        sources: ['Certificate_Number']
        type: text
      - target: prim_emp_abbreviation
        sources: ['Prim_Emp_Abbreviation']
        type: text
      - target: prim_emp_name
        sources: ['Prim_Emp_Name']
        type: text
      - target: sec_policy_carrier
        sources: ['Sec_Policy_Carrier']
        type: text
      - target: sec_policy_category
        sources: ['Sec_Policy_Category']
        type: text
      - target: sec_certificate_number1
        sources: ['Sec_Certificate_Number1']
        type: text
      - target: sec_emp_abbreviation
        sources: ['Sec_Emp_Abbreviation']
        type: text
      - target: sec_emp_name
        sources: ['Sec_Emp_Name']
        type: text
      - target: account_type
        sources: ['Account_Type']
        type: text
      - target: date_of_account
        sources: ['Date_Of_Account']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: patient_date_registered
        sources: ['Patient_Date_Registered']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: registration_last_modified_by
        sources: ['Registration_Last_Modified_By']
        type: text
      # Timestamps, not dates: MM/DD/YYYY H:MM with a non-padded hour. Three
      # formats are listed because the seconds and time part are not always
      # present. Candidate-key column.
      - target: appointment_datetime
        sources: ['Appointment_DateTime']
        type: date
        date_formats: ['%m/%d/%Y %H:%M', '%m/%d/%Y %H:%M:%S', '%m/%d/%Y']
      - target: duration
        sources: ['Duration']
        type: text
      - target: status1
