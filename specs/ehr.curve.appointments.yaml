        type: text
      # Empty in every delivery so far, so no format could be detected from
      # values. Typed by hand to match its DateTime_ siblings - a decision for
      # a person, recorded in the description, not a default.
      - target: datetime_bumped
        sources: ['DateTime_Bumped']
        type: date
        date_formats: ['%m/%d/%Y %H:%M', '%m/%d/%Y %H:%M:%S', '%m/%d/%Y']
        description: >
          Unpopulated in all deliveries so far. Typed to match the
          other DateTime_ columns on the reasonable assumption Curve writes
          them alike; if a value ever fails to parse the row quarantines,
          which is the outcome that gets it looked at.
      - target: bumped_by
        sources: ['Bumped_By']
        type: text
      - target: bumped_reason
        sources: ['Bumped_Reason']
        type: text
      # Kept as text on purpose. A name rule would read these two as timestamps;
      # the values are bare HHMM integers (1454 for 14:54) with no date part.
      - target: check_in_time
        sources: ['Check_In_Time']
        type: text
        description: >
          HHMM with no separator and no date - 1454 for 14:54. Not a
          timestamp, and not resolvable to one without assuming it belongs to
          the appointment date.
      - target: check_out_time
