# Athena prescription report.
#
# Header is on row 1: a "REPORT NAME :" title precedes it.
#
# NO NATURAL KEY, structurally: one order appears once per linked ICD-10
# diagnosis, so the grain is order-by-diagnosis rather than order. See notes.
#
# No 2023 data exists for this source.

# ---- Identity and routing -------------------------------------------------
# key: stable identifier for this source. Ledger history is keyed on it, so
# it never changes. name and vendor are for display only.
key: ehr.athena.prescriptions
name: Athena - Prescription Report
vendor: Athena
# group: the delivery folder the finance team drops this file into.
group: "5 Athena"
# catalog_names: what the finance team calls this report in their source
# catalogue, so the two can be matched up.
catalog_names: ['Prescription Report']
# lifecycle: active means silence from this source raises a freshness
# alert. discontinued, no_access and planned sources are never alerted on.
lifecycle: active
# expected_cadence_days: a staleness threshold for alerting ("alert if no
# new file in N days"), not a schedule. Files are uploaded every Sunday with
# ad hoc midweek re-uploads; see CLAUDE.md "How files arrive". null means
# irregular.
expected_cadence_days: 7
# coverage_start: no data exists before this date, so its absence is not a
# gap for completeness checks to report.
coverage_start: "2024-01-01"

# filename_patterns: case-insensitive regexes, a routing hint only. What a
# file actually is gets decided by the variant detector below from its header
# row, so a renamed file still loads and a misnamed one does not load wrongly.
# Not anchored on extension: the same source can arrive as CSV or XLSX.
filename_patterns:
  - 'athena.*prescription'

# natural_key: EMPTY, and structurally so. Best candidate tested was
# (cln enc id, order id, icd10 code), still leaving 74 duplicates across
# 28,018 rows. One prescription order appears once per ICD-10 diagnosis linked
# to it, so the grain is order-by-diagnosis and the vendor never intended a
# row key. Figures from docs/data-findings.md section 13; the probe itself is
# not in this repo.
#
# Dedup (CLAUDE.md, "Duplicates"): no key, so identity is every landed column
# plus an occurrence number in file order. The 47 exact-duplicate rows
# recorded in notes become occurrence 2 of their identity and survive; they
# are also reported as duplicate findings (stg.duplicate_finding).
natural_key: []

# on_new_column / on_missing_column: drift policy when the vendor changes the
# column set. An unexpected new column warns and the load continues; a missing
# column fails the file. Nothing is ever silently dropped, which is what the
# previous pipeline did.
on_new_column: warn
on_missing_column: fail
# notes: free text. Mandatory when natural_key is empty - the spec model
# rejects a keyless spec that does not record what was tested and why.
notes: >
  No natural key, and the reason is structural. One prescription
  order appears once per ICD-10 diagnosis linked to it: order 1861 on encounter
  432 arrives twice, identical except for Z113 against Z206. So order id alone
  leaves 24,763 duplicate rows across 28,018, and (cln enc id, order id) leaves
  5,930 - the figure the earlier validation pack reported.
  
  Adding the diagnosis code gets to 74 residual duplicates of 28,018, which is
  close but not a key. 47 rows are exact duplicates across all 20 columns.
  
  The grain of this report is order-by-diagnosis, not order. Reconciling it at
  order level requires collapsing diagnoses first, or a report at one row per
  order.

# variants: the shapes this source's file can take. A variant is one shape,
# detected from the header row alone - require_all lists columns that must be
# present, require_none columns that must be absent. Exactly one variant must
# match a file or the load stops; zero and two are both errors, never resolved
# by guessing. Each variant has its own read settings and column map, but all
# land on the same target names, so nothing downstream knows which shape wrote
# a row.
variants:
  # One shape so far: 20 columns. The detector uses the order columns, which
  # only this Athena report carries.
  - name: prescriptions_20
    detect:
      require_all: ['order chartdate', 'order id', 'cln enc id']
    read:
      # "REPORT NAME :" title line precedes the header, so header is row 1.
      preamble_lines: 1
    columns:
      # Column fields, explained once:
      #   target        canonical column name in the warehouse. Stable; vendors
      #                 rename, we do not.
      #   sources       accepted vendor headers, matched after normalising case,
      #                 punctuation and whitespace. List several when a vendor
      #                 has renamed a column.
      #   type          text | integer | decimal | currency | date | boolean | ndc
      #   required      the column must exist in the file AND every row must
      #                 have a value. Column absent is drift (see policy above);
      #                 value absent quarantines that one row.
      #   date_formats  strptime formats tried in order. Mandatory for dates and
      #                 never inferred: 01/02/2025 is ambiguous without one.
      #   pii           none | join_key | quasi | direct | prohibited. direct lands
      #                 encrypted; join_key stays in clear because reconciliation
      #                 joins on it; prohibited is matched for drift checks and
      #                 then discarded before any value is written anywhere.
      #   on_error      quarantine (default) | null | fail, per cell parse failure.
      #   control_total the column is additive and summed as a load control figure.
      #   max_length    over-length text fails rather than truncates.
      #   description   free text for the reader.
      - target: order_chartdate
        sources: ['order chartdate']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        required: true
      - target: order_type_grp
        sources: ['order type grp']
        type: text
      - target: order_desc
        sources: ['order desc']
        type: text
      - target: quantity_prescribed
        sources: ['quantity prescribed']
        type: text
      # cln_enc_id is the Athena encounter id. The Encounter report lacks it,
      # which is why that report has no key; asking Athena to add it there is
      # one of the four vendor requests in docs/data-findings.md.
      - target: cln_enc_id
        sources: ['cln enc id']
        type: text
        required: true
      - target: patientid
        sources: ['patientid']
        type: text
        required: true
        pii: join_key
      - target: patient_lastname
        sources: ['patient lastname']
        type: text
        pii: direct
      - target: patient_firstname
        sources: ['patient firstname']
        type: text
        pii: direct
      - target: patientdob
        sources: ['patientdob']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        pii: direct
      - target: sendto_provdr
        sources: ['sendto provdr']
        type: text
      - target: prvdr_npi_no
        sources: ['prvdr npi no']
        type: text
      - target: prvdrfrstnme
        sources: ['prvdrfrstnme']
        type: text
      - target: prvdrlstnme
        sources: ['prvdrlstnme']
        type: text
      # The ICD-10 diagnosis code. It is what multiplies one order into several
      # rows, so it is part of the best candidate key. The odd target name
      # mirrors the vendor header "cd-10 clncl rdr dgnss cd" exactly.
      - target: cd_10_clncl_rdr_dgnss_cd
        sources: ['cd-10 clncl rdr dgnss cd']
        type: text
      - target: icd10_clncl_ordr_diagdescr
        sources: ['icd10 clncl ordr diagdescr']
        type: text
      - target: order_name
        sources: ['order name']
        type: text
      - target: order_id
        sources: ['order id']
        type: text
        required: true
      - target: no_of_refills
        sources: ['no. of refills']
        type: text
      - target: patient_email
        sources: ['patient email']
        type: text
        pii: direct
      - target: patient_homephone
        sources: ['patient homephone']
        type: text
        pii: direct
