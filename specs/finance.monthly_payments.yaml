      - target: visitlocabbr
        sources: ["VisitLocAbbr"]
        type: text
      - target: visitlocdesc
        sources: ["VisitLocDesc"]
        type: text
      - target: proccatid
        sources: ["ProcCatID"]
        type: text
      - target: proccat
        sources: ["ProcCat"]
