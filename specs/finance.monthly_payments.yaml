# Monthly Payments - practice-management transaction ledger, one file per month.
#
# 40 files covering 2023-04 to 2026-07, roughly 1.29 million rows, 116 columns,
# a single stable header across every file. This is charges, payments,
# adjustments and transfers from the practice-management system, and it is the
# revenue side of financial reconciliation.
#
# THE DEFECT THIS SPEC EXISTS TO AVOID
#
# Amounts are written in accounting notation - ($40.00) means minus forty.
# 227,284 of 1,287,742 rows across the 40 files are parenthesised, 17.6%. The
# previous currency cleaner stripped $ , and whitespace but not parentheses, so
# every one of them became NULL. Because they are all credits, adjustments and
# transfers, the loss ran one way: the old parser totals $231,207,544.28 where
# the correct signed figure is $191,240,346.67, an overstatement of
# $39,967,197.61. `type: currency` handles this and there is a regression test.
#
# PHI
#
# The highest-PHI file in the estate. SSN is populated on 69% of rows and is
# never needed to reconcile a payment, so it is classified `prohibited`: the
# column is matched, so drift and column-count checks still see it, and then
# discarded without its value reaching the raw layer, quarantine or any log.
# Name, DOB, address, email and telephone are `direct` and encrypted at rest.
# ClientID, PatNum and MRN stay in clear as join keys.
#
# DATES
#
# Three different formats in one file: TransDate as 6/17/2025, TransMonth as
# "Jun 2025", PostMonth as "Oct 2025". PostMonth can be months after
# TransMonth, so period assignment must use the posting month deliberately
# rather than assuming it follows the transaction date.
#
# OPEN QUESTION
#
# This overlaps `Curve_Monthly Services` - both carry Voucher_Number,
# Service_ID, IsVoided, VisitLocAbbr, ProcCode and Fee. They appear to be
# transactions and charges from the same system. Confirm whether both are
# needed before relying on either for revenue totals.

key: finance.monthly_payments
name: Monthly Payments - PM transaction ledger
vendor: Sagebrush Practice Management
group: Finance
catalog_names: ["Monthly Payments"]
lifecycle: active
expected_cadence_days: 31
coverage_start: "2023-04-01"

filename_patterns:
  - "monthly.*payments"

# Handles both "Monthly Payments 2025-06.csv" and the partial-period form
# "Monthly Payments 2026-07 upto 07212026.csv".
period_from_filename: 'monthly payments (?P<year>\d{4})-(?P<month>\d{2})'

# A transaction line is identified by its voucher, service and sequence within
# the month. ClientID scopes it; the period keeps two months that reuse a
# sequence number apart.
natural_key: [clientid, voucher_number, service_id, seqnum]

# 116 columns is a wide, stable contract. A vendor change on either side is
# worth stopping for rather than absorbing.
on_new_column: fail
on_missing_column: fail

variants:
  - name: pm_ledger_116
    description: >
      The single observed shape - 116 columns, identical across all 40 monthly
      files from 2023-04 to 2026-07.
    detect:
      require_all: ["ClientID", "Voucher_Number", "Service_ID", "TransCode", "Amount"]
    read:
      skip_trailing_blank_rows: true
    columns:
