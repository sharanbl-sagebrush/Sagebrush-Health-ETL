# Monthly Payments - practice-management transaction ledger, one file per month.
#
# 40 files covering 2023-04 to 2026-07, roughly 1.29 million rows, 116 columns,
# a single stable header across every file. This is charges, payments,
# adjustments and transfers from the practice-management system, and it is the
# revenue side of financial reconciliation.
#
# THE DEFECT THIS SPEC EXISTS TO AVOID
#
# Amounts are written in accounting notation - ($40.00) means minus forty.
# 227,284 of 1,287,742 rows across the 40 files are parenthesised, 17.6%. The
# previous currency cleaner stripped $ , and whitespace but not parentheses, so
# every one of them became NULL. Because they are all credits, adjustments and
# transfers, the loss ran one way: the old parser totals $231,207,544.28 where
# the correct signed figure is $191,240,346.67, an overstatement of
# $39,967,197.61. `type: currency` handles this and there is a regression test.
#
# PHI
#
# The highest-PHI file in the estate. SSN is populated on 69% of rows and is
# never needed to reconcile a payment, so it is classified `prohibited`: the
# column is matched, so drift and column-count checks still see it, and then
# discarded without its value reaching the raw layer, quarantine or any log.
# Name, DOB, address, email and telephone are `direct` and encrypted at rest.
# ClientID, PatNum and MRN stay in clear as join keys.
#
# DATES
#
# Three different formats in one file: TransDate as 6/17/2025, TransMonth as
# "Jun 2025", PostMonth as "Oct 2025". PostMonth can be months after
# TransMonth, so period assignment must use the posting month deliberately
# rather than assuming it follows the transaction date.
#
# OPEN QUESTION
#
# This overlaps `Curve_Monthly Services` - both carry Voucher_Number,
# Service_ID, IsVoided, VisitLocAbbr, ProcCode and Fee. They appear to be
# transactions and charges from the same system. Confirm whether both are
# needed before relying on either for revenue totals.

# --- Identity: how this source is named and routed ------------------------
# key: the stable identifier, <group>.<vendor>.<report>. Never changes; the
# raw table, every batch and all history are keyed on it.
key: finance.monthly_payments
# name / vendor: human-readable labels for logs, alerts and reports.
name: Monthly Payments - PM transaction ledger
vendor: Sagebrush Practice Management
# group: the delivery folder the file arrives in.
group: Finance
# catalog_names: what the finance team calls this feed in their source
# catalogue, so a catalogue entry can be tied back to a spec.
catalog_names: ["Monthly Payments"]
# lifecycle: active sources are expected to keep delivering, so silence
# raises a freshness alert. discontinued / no_access / planned do not.
lifecycle: active
# expected_cadence_days: a staleness threshold for alerting ("alert if no new
# file has been seen in N days"), NOT a schedule. Files are uploaded by hand
# every Sunday with ad hoc midweek re-uploads; an early upload just resets the
# clock. See CLAUDE.md, "How files arrive". Nothing consumes this field yet.
# 31 here because the extract is one file per calendar month, so a month
# with nothing new is the earliest point at which silence means a gap.
expected_cadence_days: 31
# coverage_start: no data exists before this date, so absence before it is
# not a gap. The first monthly file is 2023-04.
coverage_start: "2023-04-01"

# filename_patterns: case-insensitive regexes, a routing HINT only. The
# variant detector below decides what a file is from its header row.
filename_patterns:
  - "monthly.*payments"

# period_from_filename: a regex with named groups year and month, for a
# source delivered one file per period. The only spec that uses it. The
# period it yields is metadata about the delivery; period assignment of a
# transaction uses PostMonth, which can be months after TransMonth.
# Handles both "Monthly Payments 2025-06.csv" and the partial-period form
# "Monthly Payments 2026-07 upto 07212026.csv".
period_from_filename: 'monthly payments (?P<year>\d{4})-(?P<month>\d{2})'

# natural_key: the target columns that identify one business row. Under the
# single dedup rule (CLAUDE.md, "Duplicates") a row's identity is this key
# plus an occurrence number in file order; same identity and same row hash on
# a newer delivery = unchanged, different hash = correction that supersedes
# the earlier row, and an older delivery never replaces a newer one.
#
# Evidence: docs/data-findings.md section 13 recorded the four-column key
# (clientid, voucher_number, service_id, seqnum) as unique across 1,287,742
# rows. The layer walk (docs/layer-walk/finance.monthly_payments.analysis.md)
# showed it is not: 181,688 groups of two to four rows share it within a
# month (paired legs of one transaction, kept apart by the occurrence
# number), and 14,956 identities recur in exactly two months, every one a
# void reversal posted later with VoidSign flipped from 1 to -1. Under the
# four-column key the reversal superseded the original and $2.06M of
# original postings left the current set.
#
# voidsign added 2026-10-16. Every cross-month pair becomes two identities
# (no pair shares a VoidSign), so the original and its reversal both stay
# current and reconciliation sums them. Within-month pairs are unaffected.
# This mirrors Curve Monthly Services, whose key is (service_id, voidsign).
#
# A transaction line is identified by its voucher, service, sequence and void
# sign within the month. ClientID scopes it; the period keeps two months that
# reuse a sequence number apart.
natural_key: [clientid, voucher_number, service_id, seqnum, voidsign]

# Drift policies: what happens when the column set changes. Both fail here,
# stricter than the warn default for new columns.
# 116 columns is a wide, stable contract. A vendor change on either side is
# worth stopping for rather than absorbing.
on_new_column: fail
on_missing_column: fail

# variants: the shapes this source's file can take. A variant is one layout,
# with its own detector, read settings and column map. Every variant lands on
# the same target names, so nothing downstream knows which shape wrote a row.
# Detection is by header presence alone (detect.require_all / require_none):
# exactly one variant must match a file, and zero or several stops the load
# rather than guessing, because the guess decides how every column is read.
variants:
  # One shape, stable across every delivery so far.
  - name: pm_ledger_116
    description: >
      The single observed shape - 116 columns, identical across all 40 monthly
      files from 2023-04 to 2026-07.
    # detect: the key columns plus the transaction code and amount - the
    # headers without which this is not a payments ledger.
    detect:
      require_all: ["ClientID", "Voucher_Number", "Service_ID", "TransCode", "Amount"]
    # read: header on row 0, no preamble, no footer. Each file ends with a
    # single trailing blank line, which skip_trailing_blank_rows drops (it is
    # also the default).
    read:
      skip_trailing_blank_rows: true
    # columns: one entry per target column. The fields, explained once:
    #   target         canonical destination name; stable even when the vendor renames
    #   sources        accepted vendor headers in preference order, matched on a
    #                  normalised form (case, punctuation and whitespace folded)
    #   type           text | integer | decimal | currency | date | boolean | ndc
    #   required       the column must exist in the file AND every row must carry a
    #                  value. Column absent = drift (on_missing_column); value absent
    #                  = that one row quarantines
    #   date_formats   strptime formats tried in order; mandatory for dates and never
    #                  inferred, because 01/02/2025 is ambiguous
    #   control_total  summed on load, recorded on the batch and checked against the
    #                  file's own totals when it has a footer
    #   pii            none | join_key | quasi | direct | prohibited. direct lands
    #                  encrypted; prohibited is matched for drift checks and then
    #                  discarded before any value is written anywhere
    #   on_error       quarantine (default) | null | fail, for a cell that will not parse
    #   max_length     text only; an over-length value fails rather than truncates
    #   description    why the column matters, kept next to the mapping
    columns:
      # The four natural-key columns come first. clientid is a join_key:
      # stored in clear because reconciliation joins on it, still PHI in
      # context.
      - target: clientid
        sources: ["ClientID"]
        type: text
        pii: join_key
        required: true
      - target: voucher_number
        sources: ["Voucher_Number"]
        type: text
        required: true
      - target: service_id
        sources: ["Service_ID"]
        type: text
        required: true
      - target: seqnum
        sources: ["SeqNum"]
        type: integer
        required: true
      # IsVoided arrives as the strings True/False; VoidSign as 1/-1. Both are
      # kept so a voided line can be excluded or reversed, whichever the
      # reconciliation needs.
      - target: isvoided
        sources: ["IsVoided"]
        type: boolean
      # Key column: a void reversal reuses the original's voucher, service and
      # sequence with VoidSign -1. Amount is already signed, so VoidSign is a
      # flag for identity and filtering, never a multiplier.
      - target: voidsign
        sources: ["VoidSign"]
        type: integer
        required: true
      - target: voidflag
        sources: ["VoidFlag"]
        type: text
      - target: transcatid
        sources: ["TransCatID"]
        type: text
      - target: transcat
        sources: ["TransCat"]
        type: text
      - target: transcatdesc
        sources: ["TransCatDesc"]
        type: text
      - target: transtype
        sources: ["TransType"]
        type: text
      - target: transcodeid
        sources: ["TransCodeID"]
        type: text
      - target: transcode
        sources: ["TransCode"]
        type: text
      - target: transdesc
        sources: ["TransDesc"]
        type: text
      # type currency: Decimal end to end, and ($40.00) parses as -40.00. This
      # column is the whole reason the spec header above exists.
      - target: amount
        sources: ["Amount"]
        type: currency
        required: true
      # Three date columns, three formats in one file. TransDate is a full
      # date; TransMonth and PostMonth are month names ("Jun 2025"), so they
      # parse to the first of the month. Each declares only its own formats.
      - target: transdate
        sources: ["TransDate"]
        type: date
        date_formats: ["%m/%d/%Y", "%Y-%m-%d"]
        required: true
      - target: transmonth
        sources: ["TransMonth"]
        type: date
        date_formats: ["%b %Y", "%B %Y"]
      - target: date_paid
        sources: ["Date_Paid"]
        type: date
        date_formats: ["%m/%d/%Y", "%Y-%m-%d"]
      - target: reimbcatid
        sources: ["ReimbCatID"]
        type: text
      - target: reimbcat
        sources: ["ReimbCat"]
        type: text
      - target: reimbcatdesc
        sources: ["ReimbCatDesc"]
        type: text
      - target: reimbcommentid
        sources: ["ReimbCommentID"]
        type: text
      - target: reimbcomment
        sources: ["ReimbComment"]
        type: text
      - target: reimbcmtdesc
        sources: ["ReimbCmtDesc"]
        type: text
      - target: inscatremid
        sources: ["InsCatRemID"]
        type: text
      - target: inscatrem
        sources: ["InsCatRem"]
        type: text
      - target: inscatremname
        sources: ["InsCatRemName"]
        type: text
      - target: carrierremid
        sources: ["CarrierRemID"]
        type: text
      - target: carrierrem
        sources: ["CarrierRem"]
        type: text
      - target: carrierremname
        sources: ["CarrierRemName"]
        type: text
      - target: inscatremcurid
        sources: ["InsCatRemCurID"]
        type: text
      - target: inscatremcur
        sources: ["InsCatRemCur"]
        type: text
      - target: inscatremcurname
        sources: ["InsCatRemCurName"]
        type: text
      - target: carrierremcurid
        sources: ["CarrierRemCurID"]
        type: text
      - target: carrierremcur
        sources: ["CarrierRemCur"]
        type: text
      - target: carrierremcurname
        sources: ["CarrierRemCurName"]
        type: text
      - target: inscatid
        sources: ["InsCatID"]
        type: text
      - target: inscat
        sources: ["InsCat"]
        type: text
      - target: inscatname
        sources: ["InsCatName"]
        type: text
      - target: carrierid
        sources: ["CarrierID"]
        type: text
      - target: carrier
        sources: ["Carrier"]
        type: text
      - target: carriername
        sources: ["CarrierName"]
        type: text
      - target: inscatorigid
        sources: ["InsCatOrigID"]
        type: text
      - target: inscatorig
        sources: ["InsCatOrig"]
        type: text
      - target: inscatorigname
        sources: ["InsCatOrigName"]
        type: text
      - target: carrierorigid
        sources: ["CarrierOrigID"]
        type: text
      - target: carrierorig
        sources: ["CarrierOrig"]
        type: text
      - target: carrierorigname
        sources: ["CarrierOrigName"]
        type: text
      - target: reference
        sources: ["Reference"]
        type: text
      # PHI block begins. join_key columns stay in clear; direct columns are
      # encrypted at rest; quasi columns are in clear but risky in
      # combination; the one prohibited column never lands at all.
      - target: patnum
        sources: ["PatNum"]
        type: text
        pii: join_key
      - target: mrn
        sources: ["MRN"]
        type: text
        pii: join_key
      - target: lname
        sources: ["LName"]
        type: text
        pii: direct
      - target: fname
        sources: ["FName"]
        type: text
        pii: direct
      - target: mi
        sources: ["MI"]
        type: text
        pii: direct
      # DOB is typed text, not date, deliberately: it is a direct identifier
      # destined for encrypted storage, not a value anything computes on.
      - target: dob
        sources: ["DOB"]
        type: text
        pii: direct
      - target: gender
        sources: ["Gender"]
        type: text
        pii: quasi
      - target: maritalstatus
        sources: ["MaritalStatus"]
        type: text
        pii: quasi
      # pii: prohibited. The column is still declared so the header index and
      # drift checks see it; its value is discarded before it reaches the raw
      # layer, quarantine or a log - even when another cell on the row fails.
      - target: ssn
        sources: ["SSN"]
        type: text
        pii: prohibited
      - target: phone
        sources: ["Phone"]
        type: text
        pii: direct
      - target: workphone
        sources: ["WorkPhone"]
        type: text
        pii: direct
      - target: cellphone
        sources: ["CellPhone"]
        type: text
        pii: direct
      - target: email
        sources: ["Email"]
        type: text
        pii: direct
      - target: patstreet1
        sources: ["PatStreet1"]
        type: text
        pii: direct
      - target: patstreet2
        sources: ["PatStreet2"]
        type: text
        pii: direct
      - target: patcity
        sources: ["PatCity"]
        type: text
        pii: quasi
      - target: patstate
        sources: ["PatState"]
        type: text
        pii: quasi
      - target: patzipcode
        sources: ["PatZipCode"]
        type: text
        pii: quasi
      # PostMonth drives period assignment and can trail TransMonth by months.
      - target: postmonth
        sources: ["PostMonth"]
        type: date
        date_formats: ["%b %Y", "%B %Y"]
      - target: svcdate
        sources: ["SvcDate"]
        type: date
        date_formats: ["%m/%d/%Y", "%Y-%m-%d"]
      - target: svcdatefrom
        sources: ["SvcDateFrom"]
        type: date
        date_formats: ["%m/%d/%Y", "%Y-%m-%d"]
      - target: svcdateto
        sources: ["SvcDateTo"]
        type: date
        date_formats: ["%m/%d/%Y", "%Y-%m-%d"]
      - target: actprovid
        sources: ["ActProvID"]
        type: text
      - target: actprov
        sources: ["ActProv"]
        type: text
      - target: actprovname
        sources: ["ActProvName"]
        type: text
      - target: actprovsuffix
        sources: ["ActProvSuffix"]
        type: text
      - target: billprovid
        sources: ["BillProvID"]
        type: text
      - target: billprov
        sources: ["BillProv"]
        type: text
      - target: billprovname
        sources: ["BillProvName"]
        type: text
      - target: billprovsuffix
        sources: ["BillProvSuffix"]
        type: text
      - target: refprovid
        sources: ["RefProvID"]
