# Wellpartner 340B claims, from the Claims tab.
#
# Natural key: Transaction #, unique across all 42,018 rows. The wider candidate
# (Rx # + Dispensed Date + NDC + Fill #) is also unique, and is a useful check if
# the transaction number is ever absent.
#
# Carries the covered-entity key twice: as 340B ID and again inside Entity Name.
# Both STD891281 and STD06489 appear.
#
# Est Entity Net Savings is one field with one meaning. The previous financial
# view used it as both the entity receivable and the profit figure; the columns
# it should have used - Program Revenue, Entity Subsidy, Est 340B Cost - are all
# present separately.

# ---- Source identity -------------------------------------------------------
# Everything above `variants:` describes the source as a whole. Each variant
# below describes one file shape the source can arrive in. Field meanings come
# from src/sbh_data_bank/registry/spec.py (SourceSpec).
#
# Stable identifier. Ledger tables and history are keyed on it; never renamed.
key: tpa.wellpartner.claims
# Display name for logs, reports and alerts.
name: Wellpartner - 340B Claims
# Who produces the extract.
vendor: Wellpartner
# The delivery folder the file arrives under.
group: "4 TPA"
# What the finance team calls this source in the delivery catalogue.
catalog_names: ['Wellpartner (Claims tab)']
# active: the source is expected to keep delivering, so silence raises an alert.
lifecycle: active
# Staleness threshold for freshness alerting, NOT a run schedule: alert when no
# new file has been seen for this many days. Files are uploaded every Sunday
# with ad hoc midweek re-uploads (CLAUDE.md, "How files arrive"); a midweek
# upload just resets the clock. Alerting is not built yet, so nothing reads
# this today. 7 is the generator default, not a measured delivery interval.
expected_cadence_days: 7

# Routing hint only: case-insensitive regexes tried against the filename. What
# a file IS is decided by the header fingerprint in the variant detectors
# below, so a renamed file still loads and a misnamed one does not load wrongly.
filename_patterns:
  - 'wellpartner.*claim'

# Natural key: the column that identifies one business row. Evidence:
# Transaction # was probed unique across all 42,018 rows
# (docs/data-findings.md, section 13). The probe itself is not in the repo.
natural_key: [transaction]

# Drift policies: what happens when the vendor's column set changes.
#   on_new_column: warn      load anyway and record the extra column for review
#   on_missing_column: fail  stop; a declared column that vanished means the
#                            file is not what this spec says it is
on_new_column: warn
on_missing_column: fail

# ---- Variants --------------------------------------------------------------
# A variant is one shape this source's file can take. Detection is by header
# presence only: every `require_all` header must exist and no `require_none`
# header may. Exactly one variant must match or the load stops - zero matches
# is an unknown file, two is a spec bug (overlapping detectors) - and there is
# never a fallback default. Each variant carries its own `read` settings and
# column map, but all variants land on the same `target` names, so nothing
# downstream knows which shape wrote a row.
variants:
  # Single variant, 119 columns. Detected by `Transaction #` (the key) plus the
  # two covered-entity columns, so a file without entity attribution is refused.
  - name: claims_119
    # Header-presence detector; see the note above `variants:`.
    detect:
      require_all: ['Transaction #', '340B ID', 'Entity Name']
    # No `read:` block: defaults apply (first sheet, header on row 0, utf-8-sig,
    # comma delimiter, trailing blank rows skipped, no totals footer).
    columns:
      # Column fields, explained once; they mean the same in every spec:
      #   target        canonical column name the value lands under; stable
      #   sources       accepted vendor headers, tried in order, matched after
      #                 normalising case, punctuation and whitespace (no fuzzy match)
      #   type          text | integer | decimal | currency | date | boolean | ndc
      #                 currency is Decimal, never float, and reads "($40.00)" as -40
      #                 ndc normalises to 11 digits or quarantines when ambiguous
      #   required      the column must exist in the file AND every row must have a
      #                 value; a blank value quarantines that one row
      #   date_formats  explicit strptime formats tried in order; never inferred
      #   control_total summed per file and checked against the file's own totals
      #                 where it has them; only for additive amounts, never rates
      #   pii           none | join_key | quasi | direct | prohibited
      #                 direct is to land encrypted; prohibited is matched so drift
      #                 checks see it, then discarded before any value is written
      #   on_error      quarantine (default) | null | fail, per cell parse failure
      #   max_length    over-length text fails rather than truncates
      #   description   free text for the reader; the pipeline does not use it
      - target: processed_date
        sources: ['Processed Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: entity_name
        sources: ['Entity Name']
        type: text
        required: true
      - target: state_of_ce
        sources: ['State of CE']
        type: text
        pii: quasi
      # Target name starts with `n` because identifiers must begin with a letter.
      # In THIS file the vendor header is `340B ID`; the description below was
      # carried over from the Pharmaforce spec, where the same key is called OPAID.
      - target: n340b_id
        sources: ['340B ID']
        type: text
        required: true
        description: >
          The covered-entity key. Two exist in this data: STD891281 (Fire
          Mesa, Nevada) and STD06489 (Southington, Connecticut). The same identifier
          appears as OPAID here, as 340B ID in Wellpartner Claims, embedded in Entity Name
          in Wellpartner Invoices, and as Associated 340B ID in the McKesson Custom
          report - which makes it the one key that ties every feed to a covered entity.
      - target: contract_pharmacy_name
        sources: ['Contract Pharmacy Name']
        type: text
      - target: replenishment_model_type
        sources: ['Replenishment Model Type']
        type: text
      - target: hub_or_spoke
        sources: ['Hub or Spoke']
        type: text
      - target: hub_pharmacy_name
        sources: ['Hub Pharmacy Name']
        type: text
      - target: pharmacy_npi
        sources: ['Pharmacy NPI']
        type: text
      - target: rx
        sources: ['Rx #']
        type: text
      # type ndc: normalised to the 11-digit form; see transforms/ndc.py.
      - target: ndc
        sources: ['NDC']
        type: ndc
      - target: gpi
        sources: ['GPI']
        type: text
      - target: drug_name
        sources: ['Drug Name']
        type: text
      - target: manufacturer
        sources: ['Manufacturer']
        type: text
      - target: batch_type
        sources: ['Batch Type']
        type: text
      - target: batch_submission_date
        sources: ['Batch Submission Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      - target: direct_feed_batch_id
        sources: ['Direct Feed Batch ID']
        type: text
      - target: drug_type
        sources: ['Drug Type']
        type: text
      - target: specialty_drug
        sources: ['Specialty Drug']
        type: text
      - target: storage_flag
        sources: ['Storage Flag']
        type: text
      - target: diabetic_supply
        sources: ['Diabetic Supply']
        type: text
      - target: drug_class
        sources: ['Drug Class']
        type: text
      - target: schedule
        sources: ['Schedule']
        type: text
      - target: mdq
        sources: ['MDQ']
        type: decimal
      - target: rx_written_date
        sources: ['Rx Written Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
      # The dispense date; required so every claim can be placed in a period.
      - target: dispensed_date
        sources: ['Dispensed Date']
        type: date
        date_formats: ['%m/%d/%Y', '%Y-%m-%d']
        required: true
      - target: fill
        sources: ['Fill #']
        type: text
      # Quantities and the money block that follows are control totals: summed per
      # file for the batch record. Wellpartner ships no totals footer.
      - target: dispensed_qty
        sources: ['Dispensed Qty']
        type: decimal
        control_total: true
      # The vendor header really is "Days` Supply" with a backtick. Header matching
      # normalises punctuation away, so this also matches "Days Supply" if the
      # vendor ever fixes it - the previous parser matched the typo byte-for-byte
      # and would have gone null the day they did.
      - target: days_supply
        sources: ['Days` Supply']
        type: decimal
      - target: packages_dispensed
        sources: ['Packages Dispensed']
        type: decimal
        control_total: true
      - target: program_revenue
        sources: ['Program Revenue']
        type: currency
        control_total: true
      - target: patient_paid
        sources: ['Patient Paid']
        type: currency
        control_total: true
      - target: est_340b_cost
        sources: ['Est 340B Cost']
        type: currency
        control_total: true
      - target: est_wholesale_cost
        sources: ['Est Wholesale Cost']
        type: currency
        control_total: true
      - target: admin_fee
        sources: ['Admin Fee']
        type: currency
        control_total: true
      - target: dispensing_fee
        sources: ['Dispensing Fee']
        type: currency
        control_total: true
      - target: entity_subsidy
        sources: ['Entity Subsidy']
        type: currency
        control_total: true
      - target: est_entity_net_savings
        sources: ['Est Entity Net Savings']
        type: currency
        control_total: true
        description: >
          Estimated savings, and only that. The previous financial view
          used this single field as both the entity receivable and the profit
          figure, which double-counts one number into two meanings. Program
          Revenue, Entity Subsidy and Est 340B Cost are separate columns and should
          stay separate.
      - target: transaction_status
        sources: ['Transaction Status']
        type: text
      - target: transaction_type
        sources: ['Transaction Type']
        type: text
      - target: reversal_request_source
        sources: ['Reversal Request Source']
        type: text
      - target: ticket
        sources: ['Ticket #']
        type: text
      - target: reprocessing_reason
        sources: ['Reprocessing Reason']
        type: text
      - target: reversal_method
        sources: ['Reversal Method']
        type: text
      - target: rilot_reason
        sources: ['RILOT Reason']
        type: text
      # The natural key.
      - target: transaction
        sources: ['Transaction #']
        type: text
        required: true
      - target: patient_group
        sources: ['Patient Group']
        type: text
      - target: encounter_match_method
